name: Laravel Tests

on: [push]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, mysql, pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Tests
        # Добавляем создание отчета (XML файл)
        run: php artisan test --log-junit report.xml

      - name: Upload Artifacts
        # Специальное действие GitHub для создания того самого раздела внизу
        uses: actions/upload-artifact@v4
        with:
          name: my-test-report
          path: report.xml